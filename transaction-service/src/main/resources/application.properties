spring.application.name=transaction-service

# Server Port
server.port=8083

# Synchronous Account Service calls
account-service.base-url=http://localhost:8082
account-service.connect-timeout-ms=2000
account-service.read-timeout-ms=5000

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/transaction_db
spring.datasource.username=postgres
spring.datasource.password=admin

# PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Hibernate Configuration
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
