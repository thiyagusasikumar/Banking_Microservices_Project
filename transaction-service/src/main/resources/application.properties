spring.application.name=transaction-service
spring.application.name=transaction-service
server.port=${SERVER_PORT:8083}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/transaction_db}
spring.datasource.username=${DATABASE_USER:transaction_user}
spring.datasource.password=${DATABASE_PASSWORD:transaction_password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
management.endpoints.web.exposure.include=health,info
account-service.base-url=${ACCOUNT_SERVICE_URL:http://localhost:8082}
resilience4j.circuitbreaker.instances.accountOperations.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountOperations.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountOperations.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountOperations.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.accountLookup.slidingWindowSize=10
resilience4j.circuitbreaker.instances.accountLookup.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.accountLookup.failureRateThreshold=50
resilience4j.circuitbreaker.instances.accountLookup.waitDurationInOpenState=30s
resilience4j.bulkhead.instances.accountOperations.maxConcurrentCalls=20
resilience4j.bulkhead.instances.accountOperations.maxWaitDuration=0
resilience4j.bulkhead.instances.accountLookup.maxConcurrentCalls=20
resilience4j.bulkhead.instances.accountLookup.maxWaitDuration=0
resilience4j.retry.instances.accountLookup.maxAttempts=3
resilience4j.retry.instances.accountLookup.waitDuration=200ms
resilience4j.retry.instances.accountLookup.enableExponentialBackoff=true
resilience4j.retry.instances.accountLookup.exponentialBackoffMultiplier=2
