spring.application.name=ledger-service

server.port=8084

spring.datasource.url=${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger_db}
spring.datasource.username=${LEDGER_DB_USERNAME:postgres}
spring.datasource.password=${LEDGER_DB_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.web.error.include-message=always

# Service discovery
eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.hostname}:${server.port}
