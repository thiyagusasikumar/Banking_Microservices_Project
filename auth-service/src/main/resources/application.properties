spring.application.name=auth-service

server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
#JWT validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url}/realms/${keycloak.realm}

   #For login
keycloak.token-url=${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/token

keycloak.server-url=http://localhost:8080
keycloak.realm=banking-service
keycloak.client-id=banking-auth-service
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET}

#server
spring.kafka.bootstrap-servers=localhost:9092

#producer-serializer

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer



#kafka-topic

app.kafka.topics.auth-events=auth-events


