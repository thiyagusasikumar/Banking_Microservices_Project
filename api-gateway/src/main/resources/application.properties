spring.application.name=api-gateway
server.port=${SERVER_PORT:8090}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${spring.cloud.client.hostname}:${server.port}

# Explicit routes keep service internals and actuator endpoints off the public API.
spring.cloud.gateway.server.webflux.discovery.locator.enabled=false
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.server.webflux.routes[1].id=account-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/accounts/**
spring.cloud.gateway.server.webflux.routes[2].id=transaction-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/transactions/**
spring.cloud.gateway.server.webflux.routes[3].id=ledger-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ledger-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/ledger/**
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/notification/**
# These two services are scaffolds; their controllers are not implemented yet.
spring.cloud.gateway.server.webflux.routes[5].id=approval-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://approval-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/approvals/**
spring.cloud.gateway.server.webflux.routes[6].id=reconciliation-service
spring.cloud.gateway.server.webflux.routes[6].uri=lb://reconciliation-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/reconciliation/**

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=3000
# No global response timeout: /notification/stream is a long-lived SSE connection.
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:banking-service}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.server-url}/realms/${keycloak.realm}
# Supplying both URLs allows startup without contacting Keycloak, retaining issuer validation.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.server-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
gateway.cors.allowed-origins=${GATEWAY_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
